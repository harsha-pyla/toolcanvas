<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolCanvas — Coming Soon</title>
  <meta name="description" content="ToolCanvas is getting a completely new look and set of tools. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14161A;
      --paper: #FCFCFB;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #555;
      max-width: 600px;
      line-height: 1.5;
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      position: absolute;
      top: 2rem;
      left: 2rem;
    }
  </style>
</head>
<body>
  <div class="logo">ToolCanvas</div>
  
  <main>
    <h1>Coming Soon</h1>
    <p>We are currently rebuilding ToolCanvas from the ground up to provide accurate, reliable, and privacy-first tools for freelancers.</p>
  </main>
</body>
</html>
